[package]
name = "edupdf_ia"
version = "1.0.0"
description = "EduPDF IA - aplicativo desktop"
edition = "2021"

[lib]
name = "edupdf_ia_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
