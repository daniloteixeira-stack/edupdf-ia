name: Instalador Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["projeto/web/**", ".github/workflows/windows-exe.yml"]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: projeto/web
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_PLATFORM: desktop
    steps:
      - uses: actions/checkout@v4
      - name: Conferir variaveis
        shell: bash
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Defina VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY nas variaveis do repositorio."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projeto/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projeto/web/src-tauri
      - run: npm ci
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: EduPDF-IA-Windows
          path: projeto/web/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
